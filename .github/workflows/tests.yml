name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        router: ['^0.1', '^0.2']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, xml
          tools: composer:v2
          coverage: none

      - name: Validate Composer
        run: composer validate --strict

      - name: Select supported Router version
        run: composer require --no-update --no-interaction "wilycode/router:${{ matrix.router }}"

      - name: Install dependencies
        run: composer update --with-all-dependencies --no-interaction --prefer-dist --no-progress

      - name: Run tests
        run: composer test

  without-router:
    name: Install without Router
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, xml
          tools: composer:v2
          coverage: none

      - name: Install runtime dependencies only
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress

      - name: Verify installation without Router
        run: php tests/no-router-smoke.php
